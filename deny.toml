# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked dependency is a supply-chain smell even when no advisory exists for it.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. Unicode-3.0 arrives transitively through the ICU crates that
# hickory-proto pulls in; ISC through ring-adjacent crates.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "ISC",
  # foldhash, reached through hashbrown -> petgraph -> prost-build. Zlib is permissive and
  # OSI-approved; it is listed separately so the reason for it stays visible.
  "Zlib",
]
confidence-threshold = 0.93
# MPL-2.0 is *file-level* copyleft: linking an unmodified MPL crate into an MIT project is fine, and
# the obligation only attaches to MPL-licensed files that are themselves changed. Symphonia is the
# audio decoder RAOP's `stream_file` needs (`docs/research/rust-crates.md` §7 flagged the licence as
# wanting a sanity check, and this is it), and it is used unmodified — no vendoring, no patches.
# Listed crate by crate rather than added to `allow` so that a *new* MPL dependency arriving through
# some other path still fails the build and gets the same deliberate decision.
exceptions = [
  { allow = ["MPL-2.0"], crate = "symphonia" },
  { allow = ["MPL-2.0"], crate = "symphonia-bundle-flac" },
  { allow = ["MPL-2.0"], crate = "symphonia-bundle-mp3" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-aac" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-adpcm" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-alac" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
  { allow = ["MPL-2.0"], crate = "symphonia-codec-vorbis" },
  { allow = ["MPL-2.0"], crate = "symphonia-common" },
  { allow = ["MPL-2.0"], crate = "symphonia-core" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-caf" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-isomp4" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-mkv" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-ogg" },
  { allow = ["MPL-2.0"], crate = "symphonia-format-riff" },
  { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
]

[bans]
# Duplicate versions are an error, with every duplicate that exists today enumerated in `skip`
# below. The point of the flip is regression pressure: the five known duplicates are all inside the
# protobuf build toolchain or the tail of the syn 2 -> syn 3 migration, i.e. things that resolve
# themselves as upstream catches up, whereas a *new* duplicate arriving in the runtime graph is
# something a reviewer should have to look at deliberately. Every entry below names the crate that
# pulls it, so that when the pulling crate is bumped the entry can be deleted and the build will
# say so if it was still needed.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

deny = [
  # This project is pure Rust by design, and pulling OpenSSL back in through a transitive
  # dependency would reintroduce the C toolchain requirement that the crate selection in
  # docs/research/rust-crates.md was written to avoid.
  { name = "openssl", use-instead = "rustls" },
  { name = "openssl-sys", use-instead = "rustls" },
]
# Exactly the duplicates present as of this commit, each pinned to the *stale* version so that a
# third version of any of them still fails. None of these reach a shipped binary's runtime graph:
# every one is a build-dependency of `pyatv-proto-mrp` (protobuf codegen) or a proc-macro.
skip = [
  # petgraph 0.8.3 (via prost-build 0.14.4, the build-dependency that generates the MRP protobuf
  # types) still wants hashbrown 0.15; indexmap 2.14 — reached through the same petgraph and
  # through plist — has moved to 0.17.
  { crate = "hashbrown@0.15.5", reason = "petgraph 0.8.3 <- prost-build 0.14.4, a build-dependency of pyatv-proto-mrp" },
  # protox-parse 0.9.0 lags one minor behind prost-reflect 0.16.5, and both are pulled by protox
  # 0.9.1 — also a build-dependency of pyatv-proto-mrp. The three logos crates are one dependency
  # wearing three hats (facade, derive macro, codegen backend), so they always duplicate together.
  { crate = "logos@0.15.1", reason = "protox-parse 0.9.0 <- protox 0.9.1, a build-dependency of pyatv-proto-mrp" },
  { crate = "logos-codegen@0.15.1", reason = "protox-parse 0.9.0 <- protox 0.9.1, a build-dependency of pyatv-proto-mrp" },
  { crate = "logos-derive@0.15.1", reason = "protox-parse 0.9.0 <- protox 0.9.1, a build-dependency of pyatv-proto-mrp" },
  # The syn 2 -> syn 3 transition. serde_derive, thiserror-impl, tokio-macros and clap_derive have
  # all moved to syn 3.0.4; curve25519-dalek-derive, prost-build/prost-derive, protox's logos
  # backends, miette-derive, prettyplease, tracing-attributes and rubato's `visibility` have not.
  # Delete this entry once the laggards catch up — the build will tell you if it was premature.
  { crate = "syn@2.0.119", reason = "proc-macro crates that have not yet migrated to syn 3: curve25519-dalek-derive, prost-derive, logos-codegen, miette-derive, prettyplease, tracing-attributes, visibility" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
