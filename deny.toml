# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked dependency is a supply-chain smell even when no advisory exists for it.
yanked = "deny"
ignore = []

[licenses]
# Permissive licences only. Unicode-3.0 arrives transitively through the ICU crates that
# hickory-proto pulls in; ISC through ring-adjacent crates.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
  "ISC",
  # foldhash, reached through hashbrown -> petgraph -> prost-build. Zlib is permissive and
  # OSI-approved; it is listed separately so the reason for it stays visible.
  "Zlib",
]
confidence-threshold = 0.93
exceptions = []

[bans]
# Duplicate versions are a warning, not an error: the crypto stack co-resolves cleanly today, and a
# transitive duplicate somewhere else should not block a build. Revisit if the count grows.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

deny = [
  # This project is pure Rust by design, and pulling OpenSSL back in through a transitive
  # dependency would reintroduce the C toolchain requirement that the crate selection in
  # docs/research/rust-crates.md was written to avoid.
  { name = "openssl", use-instead = "rustls" },
  { name = "openssl-sys", use-instead = "rustls" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
