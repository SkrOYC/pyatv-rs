[package]
name = "pyatv-proto-airplay"
description = "AirPlay 1/2 and RAOP audio for pyatv-rs, including the bidirectional RTSP/HTTP-over-one-socket codec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
plist = "1.10.0"
pyatv-core.workspace = true
pyatv-pairing.workspace = true
rand = "0.10.2"
thiserror.workspace = true
tokio.workspace = true
tokio-util = { version = "0.7.19", features = ["codec"] }
tracing.workspace = true

[features]
# The hermetic AirPlay 2 receiver in `test_support`, published as part of the library so the
# umbrella crate's integration tests can stand the same device up behind a real `connect()`.
test-support = ["pyatv-pairing/test-server"]

[dev-dependencies]
# Self dev-dependency: the only way to turn a feature on for this crate's *own* test binaries, so
# `cargo test -p pyatv-proto-airplay` keeps working without `--all-features`.
pyatv-proto-airplay = { path = ".", features = ["test-support"] }
pyatv-pairing = { workspace = true, features = ["test-server"] }
serde_json = "1.0.151"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
