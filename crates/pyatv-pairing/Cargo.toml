[package]
name = "pyatv-pairing"
description = "Shared HAP crypto and pairing stack for pyatv-rs: TLV8, HKDF-SHA512, SRP6a, Ed25519/X25519, ChaCha20-Poly1305 session framing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# A reference HAP accessory (`crate::server`) with pyatv's fixed test key material, so the client
# state machines can be driven end to end without a device. Also unlocks the `#[doc(hidden)]`
# constructors that pin a controller's pair-verify X25519 ephemeral (`EphemeralExchange::from_scalar`,
# `PairVerify::start_with`), which the known-answer vectors in `tests/kat/` need in order to replay a
# fixed exchange. Test-only; never enable it in a build that ships.
test-server = []

[lints]
workspace = true

[dependencies]
aes = "0.9.2"
aes-gcm = "0.11.1"
bytes.workspace = true
chacha20poly1305 = "0.11.0"
ctr = "0.10.1"
ed25519-dalek = "3.0.0"
hex = "0.4.3"
hkdf = "0.13.0"
num-bigint = "0.5.1"
plist = "1.10.0"
pyatv-core.workspace = true
rand = "0.10.2"
rand_core = "0.10.1"
sha1 = "0.11.0"
sha2 = "0.11.0"
# Pinned exactly. `crate::srp_hap` calls into `srp::utils`, which the crate marks
# `#[doc(hidden)] pub` and therefore keeps outside its semver promise, and 0.7 is still a release
# candidate. A patch bump that renamed `compute_m1_rfc5054` or flipped its `g_no_pad` argument would
# break HAP interop, so upgrades have to be a deliberate act followed by a `tests/kat` re-run.
srp = "=0.7.0-rc.3"
subtle = "2.6.1"
thiserror.workspace = true
x25519-dalek = "3.0.0"
zeroize = "1.9.0"

[dev-dependencies]
# `default-features = false` drops `plotters` and `rayon`; `cargo_bench_support` is the one feature
# `cargo bench` actually needs. See `benches/`.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
hex = "0.4.3"
serde_json = "1.0.151"
sha2 = "0.11.0"
# Same exact pin as the normal dependency above, for the same reason.
srp = "=0.7.0-rc.3"

[[bench]]
name = "tlv8"
harness = false

[[bench]]
name = "chacha"
harness = false
