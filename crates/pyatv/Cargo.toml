[package]
name = "pyatv"
description = "Pure-Rust client library for Apple TV and AirPlay devices: scan, pair and connect over MRP, Companion, AirPlay, RAOP and DMAP."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
pyatv-core.workspace = true
pyatv-mdns.workspace = true
pyatv-pairing.workspace = true
pyatv-proto-airplay.workspace = true
pyatv-proto-companion.workspace = true
pyatv-proto-dmap.workspace = true
pyatv-proto-mrp.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
hound = "3.5.1"
# The hermetic devices each protocol crate ships behind its own `test-support` feature. This is the
# one place where several stand up at once, which is what makes the relayer priorities and the
# AirPlay-to-MRP tunnel testable end to end without hardware. DMAP is here for the opposite reason:
# it never coexists with the others on real hardware, so its test stands one up alone.
pyatv-pairing = { workspace = true, features = ["test-server"] }
pyatv-proto-airplay = { workspace = true, features = ["test-support"] }
pyatv-proto-companion = { workspace = true, features = ["test-support"] }
pyatv-proto-dmap = { workspace = true, features = ["test-support"] }
pyatv-proto-mrp = { workspace = true, features = ["test-support"] }
# `fs` is for `helpers`' unit tests, which write a scratch file to check `is_streamable` rejects
# it. It compiled before this line existed only because `cli/atvremote` asks for `tokio/full` and
# Cargo unifies features across a workspace build — `cargo hack --feature-powerset` checking this
# crate on its own is what surfaced it.
tokio = { workspace = true, features = [
  "rt-multi-thread",
  "macros",
  "net",
  "time",
  "sync",
  "fs",
] }
