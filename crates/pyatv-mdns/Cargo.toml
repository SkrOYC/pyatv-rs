[package]
name = "pyatv-mdns"
description = "mDNS/DNS-SD discovery for pyatv-rs: multicast browse/resolve plus a placeholder unicast host scanner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
if-addrs = "0.15.0"
pyatv-core.workspace = true
socket2 = "0.6.5"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
unicode-normalization = "0.1.25"

[dev-dependencies]
# `default-features = false` drops `plotters` and `rayon`; `cargo_bench_support` is the one feature
# `cargo bench` actually needs. See `benches/dns.rs`.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "dns"
harness = false
