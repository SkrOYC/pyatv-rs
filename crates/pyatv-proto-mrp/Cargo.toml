[package]
name = "pyatv-proto-mrp"
description = "MediaRemote Protocol (MRP) for pyatv-rs: protobuf message layer over direct TCP or an AirPlay remote-control tunnel."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
prost = "0.14.4"
pyatv-core.workspace = true
pyatv-pairing.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid = { version = "1.25.0", features = ["v4", "rng-getrandom"] }

[build-dependencies]
heck = "0.5.0"
prost-build = "0.14.4"
prost-types = "0.14.4"
protox = "0.9.1"

[dev-dependencies]
bytes.workspace = true
hex = "0.4.3"
pyatv-core.workspace = true
pyatv-pairing = { workspace = true, features = ["test-server"] }
serde_json = "1.0.151"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
