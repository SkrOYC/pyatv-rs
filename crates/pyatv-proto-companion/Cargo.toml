[package]
name = "pyatv-proto-companion"
description = "Companion link protocol for pyatv-rs: 4-byte framing over OPACK payloads with HAP pairing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
plist = { version = "1.10.0", default-features = false }
pyatv-core.workspace = true
pyatv-opack.workspace = true
pyatv-pairing.workspace = true
rand = "0.10.2"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# The hermetic Companion device in `test_support`, published as part of the library so the umbrella
# crate's integration tests can stand the same device up behind a real `connect()`.
test-support = ["pyatv-pairing/test-server"]

[dev-dependencies]
bytes.workspace = true
hex = "0.4.3"
# Self dev-dependency: the only way to turn a feature on for this crate's *own* test binaries, so
# `cargo test -p pyatv-proto-companion` keeps working without `--all-features`.
pyatv-proto-companion = { path = ".", features = ["test-support"] }
pyatv-core.workspace = true
pyatv-pairing = { workspace = true, features = ["test-server"] }
serde_json = "1.0.151"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
